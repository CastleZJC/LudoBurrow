<!DOCTYPE html>
<!-- LudoBurrow 主菜单原型（平台级页面视觉基准）
     与实现对齐：src/components/MainMenu.vue + src/style.css（设计 token 同源，2026-09-06） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LudoBurrow 原型 · 主菜单</title>
<style>
  /* 设计 token（与 src/style.css :root 单一出处同源） */
  :root {
    --color-primary: #4f7cff;
    --color-primary-dark: #3a63d9;
    --color-accent: #ffb020;
    --color-danger: #d64545;
    --color-surface: #ffffff;
    --color-bg: #f5f7fb;
    --color-border: #d8dee9;
    --color-text: #24292f;
    --color-text-secondary: #6b7280;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-md: 0 4px 12px rgb(36 41 47 / 12%);
    --shadow-lg: 0 8px 28px rgb(36 41 47 / 18%);
    --color-primary-soft: #eef2ff;
    --color-accent-soft: #fff4dc;
    --color-success: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  }
  /* 平台通用按钮（与 style.css 同源） */
  .primary-btn, .secondary-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    transition: filter 0.15s;
  }
  .primary-btn { background: var(--color-primary); color: #fff; }
  .secondary-btn { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
  .primary-btn:hover, .secondary-btn:hover { filter: brightness(1.05); }

  /* ---- 主菜单（MainMenu.vue 同源样式） ---- */
  .main-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 48px 24px;
    min-height: 100vh;
  }
  .app-title { font-size: 40px; margin: 0; color: var(--color-primary); }
  .app-subtitle { margin: 0; color: var(--color-text-secondary); }
  .game-list { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .game-entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 180px;
    padding: 24px 16px;
    border-radius: var(--radius-lg);
    border: 2px solid var(--color-border);
    background: var(--color-surface);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .game-entry:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .game-icon { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .game-name { font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
  <div class="main-menu" data-view="menu">
    <h1 class="app-title">LudoBurrow 玩趣洞</h1>
    <p class="app-subtitle">免安装的益智游戏小窝</p>

    <div class="game-list">
      <button class="game-entry" data-game="keygame">
        <span class="game-icon" aria-hidden="true">⌨️</span>
        <span class="game-name">键盘按键</span>
      </button>
      <button class="game-entry" data-game="jigsaw">
        <span class="game-icon" aria-hidden="true">🧩</span>
        <span class="game-name">拼图</span>
      </button>
      <button class="game-entry" data-game="maze">
        <span class="game-icon" aria-hidden="true">🌀</span>
        <span class="game-name">迷宫</span>
      </button>
    </div>

    <button class="secondary-btn" data-menu="settings">设置</button>
  </div>
</body>
</html>
